[package]
name = "proton-pass-common"
edition.workspace = true
version.workspace = true

[lib]
doctest = false

[features]
default = []
uniffi = ["dep:uniffi", "proton-pass-totp/uniffi"]
serde = ["proton-pass-totp/serde", "proton-pass-types?/serde"]
wasm = ["serde", "dep:tsify", "dep:wasm-bindgen", "proton-pass-totp/wasm"]
resize-image = ["dep:image", "dep:zenwebp"]
cxf = [
    "dep:credential-exchange-format",
    "dep:proton-pass-types",
    "dep:chrono",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:rsa",
    "dep:ed25519-dalek",
    "dep:pkcs8",
]
cxp = [
    "cxf",
    "dep:credential-exchange-protocol",
    "dep:hpke",
    "dep:jose-jwk",
    "dep:parking_lot",
    "dep:zeroize",
    "dep:flate2",
]
duplicate = ["dep:proton-pass-types"]
gunzip = ["dep:flate2"]

[dependencies]
uniffi = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
proton-pass-derive = { path = "../proton-pass-derive" }
proton-pass-totp = { path = "../proton-pass-totp" }
proton-pass-types = { path = "../proton-pass-types", optional = true }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

# CXF/CXP dependencies
credential-exchange-format = { git = "https://github.com/bitwarden/credential-exchange", rev = "22a87d9852ae64a659ae37774bd9194fd362bdde", optional = true }
credential-exchange-protocol = { git = "https://github.com/bitwarden/credential-exchange", rev = "22a87d9852ae64a659ae37774bd9194fd362bdde", optional = true }

chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
ed25519-dalek = { version = "3", features = ["pkcs8"], optional = true }
flate2 = { version = "1", optional = true }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha", "aes"], optional = true }
jose-jwk = { version = "0.1", default-features = false, optional = true }
p256 = { version = "0.14", optional = true }
p384 = { version = "0.14", optional = true }
p521 = { version = "0.14", optional = true }
parking_lot = { version = "0.12", optional = true }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
rsa = { version = "0.10.0-rc.18", optional = true }
zeroize = { version = "1", optional = true }

# Passkeys dependency
passkey = { git = "https://github.com/1Password/passkey-rs.git", rev = "1606717bd9888b629905d435bb876b24b1aaddb5" }
passkey-authenticator = { git = "https://github.com/1Password/passkey-rs.git", rev = "1606717bd9888b629905d435bb876b24b1aaddb5" }
passkey-types = { git = "https://github.com/1Password/passkey-rs.git", rev = "1606717bd9888b629905d435bb876b24b1aaddb5", features = ["serialize_bytes_as_base64_string"] }
public-suffix = { git = "https://github.com/1Password/passkey-rs.git", rev = "1606717bd9888b629905d435bb876b24b1aaddb5" }

coset = "0.4.2"
email_address = "0.2.9"
file-format = { version = "0.29.0", features = ["reader"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
lazy_static = "1.5.0"
luhn = "1.0.1"
qrcode = "0.14.1"
rand = "0.10"
regex-lite = "0.1.6"
rmp-serde = "1.3.0"
sha2 = "0.11"
ssh-key = { version = "0.7.0-rc.11", features = ["std", "crypto", "ed25519", "rsa", "encryption", "alloc"] }
smallvec = { version = "1.15.1", features = ["serde"] }
url = "2.5.4"
pulldown-cmark = { version = "0.13", default-features = false }
zenwebp = { version = "0.4", optional = true }

[dev-dependencies]
criterion.workspace = true
tokio.workspace = true
proptest = "1"
proton-pass-types = { path = "../proton-pass-types" }

[[bench]]
name = "card_detector"
harness = false

[[bench]]
name = "duplicate_detection"
harness = false

[[bench]]
name = "password_scorer"
harness = false

[[bench]]
name = "markdown_renderer"
harness = false

[[bench]]
name = "markdown_renderer_allocations"
harness = false
