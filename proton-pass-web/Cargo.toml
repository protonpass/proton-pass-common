[package]
name = "proton-pass-web"
edition.workspace = true
version.workspace = true

# Flags for cargo-release
[package.metadata.release]
pre-release-replacements = [
    {file="package.json", search="  \"version\":.*", replace="  \"version\": \"{{version}}\","}
]

# Needed since rust 1.87+
# https://github.com/rustwasm/wasm-pack/issues/1501
# --enable-simd needed since newer rustc versions enable the simd128 target feature by default
# for wasm32-unknown-unknown (https://github.com/rust-lang/rust/pull/128918)
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]

[lib]
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
proton-pass-common = { path = "../proton-pass-common", default-features = false, features = ["wasm"] }
proton-pass-types = { path = "../proton-pass-types", features = ["wasm"] }

async-trait.workspace = true
js-sys.workspace = true
serde.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[features]
web_username = []
web_password = []
web_ui = []
web_worker = [
    "web_password",
    "proton-pass-types/wasm"
]
web_cxf = ["proton-pass-common/cxf"]
web_duplicate = ["proton-pass-common/duplicate"]
web_image = ["resize-image"]
web_proto = []
experimental = []
resize-image = ["proton-pass-common/resize-image"]
